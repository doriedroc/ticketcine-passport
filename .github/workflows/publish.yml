name: Publish

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # criar tag e GitHub Release
      issues: write # comentar nas issues resolvidas
      pull-requests: write # comentar nos PRs incluídos na release
      id-token: write # OIDC do Trusted Publishing no npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # o semantic-release precisa do histórico e das tags
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: yarn semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
